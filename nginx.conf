server {
    listen 80;
    server_name theooo.app www.theooo.app;

    # Redirige HTTP → HTTPS (à activer après certbot)
    # return 301 https://$host$request_uri;

    root /var/www/yugen;
    index index.html;

    # Frontend Vue (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API Express
    location /api/ {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Images uploadées
    location /uploads/ {
        proxy_pass http://localhost:3001;
    }
}

